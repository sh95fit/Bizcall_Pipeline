name: Deploy to Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'src/pipeline/**'
            api:
              - 'src/api/**'

  deploy-pipeline:
    needs: detect-changes
    if: needs.detect-changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::173249517772:role/bizcall-github-deploy-role
          aws-region: ap-northeast-2

      - name: Install dependencies
        run: |
          pip install -r src/pipeline/requirements.txt -t src/pipeline/package

      - name: Package function
        run: |
          mkdir -p src/pipeline/package
          cp src/pipeline/main.py src/pipeline/package/
          cp -r src/pipeline/stt src/pipeline/package/stt
          cp -r src/pipeline/ai src/pipeline/package/ai
          cd src/pipeline/package
          zip -r ../../../pipeline.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name bizcall-pipeline \
            --zip-file fileb://pipeline.zip

  deploy-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::173249517772:role/bizcall-github-deploy-role
          aws-region: ap-northeast-2

      - name: Install dependencies
        run: |
          pip install -r src/api/requirements.txt -t src/api/package

      - name: Package function
        run: |
          cd src/api/package
          cp ../main.py .
          zip -r ../../../api.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name bizcall-api \
            --zip-file fileb://api.zip
